; =============================================================================
; lestari-queue.conf — RabbitMQ Queue Workers
; =============================================================================
; Menjalankan 2 worker paralel untuk memproses job dari RabbitMQ.
; Dua worker memberikan konkurensi dasar: satu bisa handle email sementara
; satu lagi handle job lain secara bersamaan.
;
; numprocs=2 → supervisord akan spawn lestari-queue:0 dan lestari-queue:1
; =============================================================================

[program:lestari-queue]
; queue:work lebih baik dari queue:listen di production (proses persistent)
; --sleep=3: tunggu 3 detik jika queue kosong (hemat CPU)
; --tries=3: retry job gagal maksimal 3 kali
; --timeout=90: timeout per job 90 detik
; --max-jobs=1000: restart worker setelah 1000 job (cegah memory leak)
command=/usr/local/lsws/lsphp83/bin/php /var/www/lestari/artisan queue:work rabbitmq
    --sleep=3
    --tries=3
    --timeout=90
    --max-jobs=1000
    --no-interaction

directory=/var/www/lestari
user=lsadm

; Spawn 2 worker paralel
numprocs=2

; Nama process akan jadi: lestari-queue:lestari-queue_0, lestari-queue_1
process_name=%(program_name)s_%(process_num)02d

autostart=true
autorestart=true
startsecs=5
startretries=3

; SIGTERM → queue:work akan selesaikan job yang sedang berjalan dulu sebelum stop
stopsignal=SIGTERM
stopwaitsecs=120

stdout_logfile=/var/log/supervisor/lestari-queue.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5

stderr_logfile=/var/log/supervisor/lestari-queue-error.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=5

environment=APP_ENV="production"
