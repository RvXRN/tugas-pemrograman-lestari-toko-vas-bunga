; =============================================================================
; lestari-octane.conf — FrankenPHP Octane HTTP Server
; =============================================================================
; Proses utama yang menangani semua HTTP request ke Lestari API.
; FrankenPHP berjalan di mode worker, me-reuse PHP runtime antar request.
;
; Server spec: 4 CPU, 8GB RAM (berbagi dengan frontend)
; Workers: 3 (sisakan 1 core untuk OS + frontend process)
; =============================================================================

[program:lestari-octane]
; Perintah start Octane dengan FrankenPHP via lsphp83
command=/usr/local/lsws/lsphp83/bin/php /var/www/lestari/artisan octane:start
    --server=frankenphp
    --host=0.0.0.0
    --port=%(ENV_OCTANE_PORT)s
    --workers=%(ENV_OCTANE_WORKERS)s
    --max-requests=%(ENV_OCTANE_MAX_REQUESTS)s
    --no-interaction

; Working directory aplikasi
directory=/var/www/lestari

; Jalankan sebagai user OLS (lsadm)
user=lsadm

; Auto start saat supervisord boot
autostart=true

; Auto restart jika proses mati karena error
autorestart=true

; Tunggu 5 detik sebelum dianggap sukses start
startsecs=5

; Coba restart maksimal 3 kali sebelum menyerah
startretries=3

; Signal untuk graceful shutdown (Octane akan drain request yang sedang berjalan)
stopsignal=SIGTERM

; Timeout graceful shutdown: 60 detik (beri waktu request in-flight selesai)
stopwaitsecs=60

; Stdout log — lihat output Octane real-time
stdout_logfile=/var/log/supervisor/lestari-octane.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5

; Stderr log — error & exception dari Octane worker
stderr_logfile=/var/log/supervisor/lestari-octane-error.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=5

; Environment override (ambil dari .env, tapi bisa di-set di sini juga)
environment=
    APP_ENV="production",
    OCTANE_SERVER="frankenphp",
    OCTANE_WORKERS="3",
    OCTANE_MAX_REQUESTS="500",
    OCTANE_PORT="8000"
