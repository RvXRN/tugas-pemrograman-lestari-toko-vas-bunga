; =============================================================================
; lestari-reverb.conf — Laravel Reverb WebSocket Server
; =============================================================================
; Reverb adalah WebSocket server built-in Laravel untuk broadcasting real-time.
; Mendengarkan di port 8080 (sesuai REVERB_PORT di .env).
;
; Reverb berjalan sebagai single process, tapi secara internal concurrent
; karena menggunakan React PHP (event loop non-blocking).
; =============================================================================

[program:lestari-reverb]
command=/usr/local/lsws/lsphp83/bin/php /var/www/lestari/artisan reverb:start
    --host=0.0.0.0
    --port=%(ENV_REVERB_PORT)s
    --no-interaction

directory=/var/www/lestari
user=lsadm

autostart=true
autorestart=true

; Reverb perlu lebih lama untuk init karena buka socket
startsecs=10
startretries=3

stopsignal=SIGTERM
stopwaitsecs=30

stdout_logfile=/var/log/supervisor/lestari-reverb.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5

stderr_logfile=/var/log/supervisor/lestari-reverb-error.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=5

environment=
    APP_ENV="production",
    REVERB_PORT="8080"
