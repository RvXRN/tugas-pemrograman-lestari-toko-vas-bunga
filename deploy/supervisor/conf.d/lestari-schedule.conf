; =============================================================================
; lestari-schedule.conf — Laravel Task Scheduler
; =============================================================================
; `schedule:work` adalah infinite loop yang mengecek scheduled tasks setiap menit.
; Ini MENGGANTIKAN entry cron `* * * * * php artisan schedule:run`.
;
; Keuntungan vs cron:
;   - Log terpusat di supervisord (tidak scattered di system cron log)
;   - Auto-restart jika command crash
;   - Bisa di-control via supervisorctl (start/stop/restart)
; =============================================================================

[program:lestari-schedule]
; schedule:work: runs pending tasks, then sleeps until next minute
command=/usr/local/lsws/lsphp83/bin/php /var/www/lestari/artisan schedule:work --no-interaction

directory=/var/www/lestari
user=lsadm

; Hanya 1 instance scheduler (tidak perlu multiple)
numprocs=1

autostart=true
autorestart=true
startsecs=5
startretries=3

stopsignal=SIGTERM
stopwaitsecs=60

stdout_logfile=/var/log/supervisor/lestari-schedule.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3

stderr_logfile=/var/log/supervisor/lestari-schedule-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

environment=APP_ENV="production"
