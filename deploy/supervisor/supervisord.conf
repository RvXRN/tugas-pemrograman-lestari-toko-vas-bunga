; =============================================================================
; supervisord.conf — Lestari Backend API Process Manager
; =============================================================================
; Mengelola semua background process Lestari:
;   1. FrankenPHP Octane   → HTTP server utama
;   2. Queue Worker x2     → Proses job RabbitMQ
;   3. Reverb WebSocket    → Real-time broadcast
;   4. Schedule Worker     → Pengganti cron job
;
; Install:  sudo apt install supervisor
; Start:    sudo supervisorctl reread && sudo supervisorctl update
; Status:   sudo supervisorctl status
; =============================================================================

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/var/run/supervisord.pid
nodaemon=false
minfds=1024
minprocs=200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; -----------------------------------------------------------------------------
; Include semua config program dari folder conf.d
; -----------------------------------------------------------------------------
[include]
files=/etc/supervisor/conf.d/lestari-*.conf
