; =============================================================================
; OLS Virtual Host Config — Lestari API (Reverse Proxy ke FrankenPHP Octane)
; =============================================================================
; File ini: /usr/local/lsws/conf/vhosts/lestari/vhconf.conf
;
; Cara apply:
;   1. Buka WebAdmin OLS: https://[server-ip]:7080
;   2. Listeners → Add Listener (port 80/443)
;   3. Virtual Hosts → Add Virtual Host → name: lestari
;   4. Atau copy manual file ini lalu: sudo /usr/local/lsws/bin/lswsctrl restart
;
; Arsitektur:
;   Internet → OLS (80/443, TLS) → FrankenPHP Octane (127.0.0.1:8000)
;
; OLS bertugas:
;   - Terminate SSL/TLS
;   - Serve static files langsung (tanpa PHP)
;   - Proxy request PHP ke FrankenPHP via HTTP
; =============================================================================

docRoot                   /var/www/lestari/public
vhDomain                  api-data.bilikku.my.id
adminEmails               rizkianasm@gmail.com
enableGzip                1
enableBr                  1

; ─── External App: FrankenPHP Octane ──────────────────────────────────────────
; OLS akan forward semua request PHP ke FrankenPHP yang berjalan di port 8000
extprocessor frankenphp {
  type                    proxy
  address                 127.0.0.1:8000
  maxConns                32
  pcKeepAliveTimeout      60
  initTimeout             60
  retryTimeout            0
  respBuffer              0
}

; ─── Script Handler: Arahkan PHP ke FrankenPHP ────────────────────────────────
scripthandler {
  add                     proxy:frankenphp php
}

; ─── Serve static assets langsung dari OLS (tanpa PHP, lebih cepat) ──────────
context /public/ {
  location              /var/www/lestari/public
  allowBrowse           0
  enableExpires         1
  expiresByType         image/*=A2592000,text/css=A604800,text/javascript=A604800,font/*=A2592000
  accessControl {
    allow               *
  }
}

; ─── Rewrite Rules: Support Laravel pretty URL ────────────────────────────────
rewrite {
  enable                1
  autoLoadHtaccess      1
  rules                 <<<END_rules
    RewriteEngine On

    # Block akses ke file sensitif
    RewriteRule ^\.env         - [F,L]
    RewriteRule ^\.git         - [F,L]

    # Serve static files langsung jika ada
    RewriteCond %{REQUEST_FILENAME} -f [OR]
    RewriteCond %{REQUEST_FILENAME} -d
    RewriteRule ^ - [L]

    # Semua request lain → index.php (Laravel router)
    RewriteRule ^ /index.php [L]
  END_rules
}

; ─── Security Headers ─────────────────────────────────────────────────────────
headers {
  useServerVars         1
  extraHeaders          <<<END_headers
    always set X-Content-Type-Options "nosniff"
    always set X-Frame-Options "DENY"
    always set Referrer-Policy "strict-origin-when-cross-origin"
    always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    unset Server
    unset X-Powered-By
  END_headers
}

; ─── Error Pages ──────────────────────────────────────────────────────────────
errorpage 404 {
  url                   /index.php
}
errorpage 503 {
  url                   /maintenance.html
}
