; =============================================================================
; OLS httpd_config snippet — Tambahkan Virtual Host Lestari
; =============================================================================
; File lengkap ada di: /usr/local/lsws/conf/httpd_config.conf
;
; JANGAN timpa seluruh file ini. Tambahkan bagian berikut ke httpd_config.conf
; yang sudah ada, atau gunakan WebAdmin GUI di https://[server-ip]:7080
; =============================================================================

; ─── Virtual Host Definition ──────────────────────────────────────────────────
; Tambahkan di bagian "virtualHost" di httpd_config.conf:

virtualhost lestari {
  vhRoot                /var/www/lestari
  configFile            /usr/local/lsws/conf/vhosts/lestari/vhconf.conf
  allowSymbolLink       1
  enableScript          1
  restrained            0
  setUIDMode            0
}

; ─── Listener Port 80 (HTTP) ──────────────────────────────────────────────────
; Tambahkan di bagian "listener" yang mendengarkan port 80:
;
; listener Default {
;   address               *:80
;   secure                0
;   map                   lestari api.lestari.id     <- tambahkan baris ini
; }

; ─── Listener Port 443 (HTTPS) ────────────────────────────────────────────────
; Buat listener baru atau tambahkan ke listener HTTPS yang sudah ada:

listener HTTPS {
  address               *:443
  secure                1
  keyFile               /etc/letsencrypt/live/api.lestari.id/privkey.pem
  certFile              /etc/letsencrypt/live/api.lestari.id/fullchain.pem
  certChain             1
  sslProtocol           24
  ciphers               ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384
  enableECDHE           1
  renegProtection       1
  sslSessionCache       1
  sslSessionTickets     0
  enableSpdy            15
  enableQuic            1
  map                   lestari api.lestari.id
}

; ─── Cara Apply via WebAdmin (Alternatif lebih mudah) ─────────────────────────
;
; 1. Buka https://[server-ip]:7080 → login admin/admin
; 2. Virtual Hosts → Add
;    - Name: lestari
;    - Root: /var/www/lestari
;    - Config File: /usr/local/lsws/conf/vhosts/lestari/vhconf.conf
; 3. Listeners → Default (port 80) → Virtual Host Mappings → Add
;    - Virtual Host: lestari
;    - Domains: api.lestari.id
; 4. Listeners → Add (HTTPS port 443) → isi SSL cert paths
; 5. Graceful Restart OLS: klik tombol ♻ di WebAdmin
